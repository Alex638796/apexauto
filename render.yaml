services:
  - type: web
    name: apexauto-bot
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_NAME
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: LOG_CHANNEL
        sync: false
      - key: USERLINK
        sync: false
      - key: TUTORIAL_VIDEO
        sync: false
